<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      The icon is a data URI, and it has to be.

      Every path under a .epoch name serves that name's single blob, so a
      /favicon.ico would not 404 — it would return this whole page, and the
      browser would try to decode an HTML document as an image. There is no
      second file to point at, so the icon travels inside the one there is.
    -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b1c34'/><path d='M32 9 L55 22 L32 35 L9 22 Z' fill='%23eaf7ff'/><path d='M9 24 L32 37 L32 56 L9 43 Z' fill='%237fc0ee'/><path d='M55 24 L32 37 L32 56 L55 43 Z' fill='%233d7ba8'/></svg>" />
    <title>PermaFrost — frozen liquidity you can actually verify</title>
    <meta
      name="description"
      content="Verify Epoch locks and vesting vaults live on Sui, freeze your own, and share a proof card nobody can forge — because the link on it re-reads the chain."
    />
    <meta name="theme-color" content="#040d1a" />
    <meta name="color-scheme" content="dark" />
    <!--
      Defence in depth. Vercel sets the real policy as a header (with
      frame-ancestors, which a meta tag cannot express), but this build is also
      published as a single Walrus blob served by a gateway that sets no
      headers at all — and that copy is the one people embed. The tightest part
      is `connect-src`: this page talks to exactly one host, and anything that
      ever tried to send a wallet address anywhere else would simply not
      connect.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:; connect-src https://graphql.mainnet.sui.io; frame-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PermaFrost — frozen liquidity you can actually verify" />
    <meta
      property="og:description"
      content="Read any Epoch lock straight from Sui. Freeze your own. Get a badge your visitors can trust, because you cannot edit what it says."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link rel="preconnect" href="https://graphql.mainnet.sui.io" crossorigin />
    <script>
      // Before first paint: a page that flashes the wrong appearance and then
      // corrects itself looks broken, and this one is asking to be trusted.
      try {
        var a = localStorage.getItem('permafrost:appearance')
        document.documentElement.dataset.appearance = a === 'aqua' ? 'aqua' : 'graphite'
      } catch (e) {
        document.documentElement.dataset.appearance = 'graphite'
      }
    </script>
  </head>
  <body>
    <div id="app" class="grain"></div>
    <noscript>
      <p style="font:15px system-ui;color:#d9e3f6;padding:32px;max-width:56ch">
        PermaFrost reads Epoch locks directly from Sui in your browser — there is no
        server to render this without JavaScript. You can still verify any lock by
        opening its object id on
        <a style="color:#29b6f6" href="https://suiscan.xyz/mainnet">Suiscan</a>.
      </p>
    </noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
