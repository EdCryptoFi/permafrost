<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      The icon is a data URI, and it has to be.

      Every path under a .epoch name serves that name's single blob, so a
      /favicon.ico would not 404 — it would return this whole page, and the
      browser would try to decode an HTML document as an image. There is no
      second file to point at, so the icon travels inside the one there is.
    -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b1c34'/><path d='M32 9 L55 22 L32 35 L9 22 Z' fill='%23eaf7ff'/><path d='M9 24 L32 37 L32 56 L9 43 Z' fill='%237fc0ee'/><path d='M55 24 L32 37 L32 56 L55 43 Z' fill='%233d7ba8'/></svg>" />
    <meta name="robots" content="noindex" />
    <title>PermaFrost badge</title>
    <!--
      This document renders inside other people's pages, so it states its own
      limits rather than relying on theirs. It loads no scripts but its own,
      talks to exactly one host, and can navigate nothing: a badge that could
      be turned into a redirect is a badge nobody should paste on a homepage.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:; connect-src https://graphql.mainnet.sui.io; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link rel="preconnect" href="https://graphql.mainnet.sui.io" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/badge/main.tsx"></script>
  </body>
</html>
